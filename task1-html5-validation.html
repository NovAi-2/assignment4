<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1. Form with HTML5 Validation</title>
  <link rel="stylesheet" href="css/plain.css">
</head>
<body>
  <h1>Contact Form (HTML5 validation)</h1>

  <form action="#" method="post">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name"
             required minlength="2" maxlength="50"
             pattern="[A-Za-zА-Яа-яЁё\s\-]+"
             title="Letters, spaces and hyphens only">
      <div class="hint">Required, 2 to 50 characters, letters only.</div>
    </div>

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required maxlength="100">
      <div class="hint">Required, must be a valid email address.</div>
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"
                required minlength="10" maxlength="300"></textarea>
      <div class="hint">Required, 10 to 300 characters.</div>
    </div>

    <button type="submit">Send</button>
  </form>
</body>
</html>
